name: Deploy website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: answerbit-production
  cancel-in-progress: false

env:
  DEPLOY_HOST: 122.51.52.232
  DEPLOY_PORT: "22"
  DEPLOY_PATH: /opt/1panel/www/sites/txanswerbit.com/index
  SITE_URL: http://122.51.52.232
  SITE_HOST: txanswerbit.com

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Build static site
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || env.SITE_URL }}
        run: npm run build

      - name: Package site
        run: tar -C out -czf "answerbit-${GITHUB_SHA}.tar.gz" .

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -Eeuo pipefail
          test -n "$DEPLOY_USER" || { echo "Missing production secret: DEPLOY_USER"; exit 1; }
          test -n "$DEPLOY_SSH_KEY" || { echo "Missing production secret: DEPLOY_SSH_KEY"; exit 1; }
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          cp .github/known_hosts "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Upload release
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -Eeuo pipefail
          scp -i "$HOME/.ssh/deploy_key" -P "$DEPLOY_PORT" \
            "answerbit-${GITHUB_SHA}.tar.gz" \
            "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/answerbit-${GITHUB_SHA}.tar.gz"

      - name: Activate release
        id: activate
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/deploy_key" -p "$DEPLOY_PORT" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            bash -s -- "$DEPLOY_PATH" "$GITHUB_SHA" <<'REMOTE'
          set -Eeuo pipefail

          target=$1
          sha=$2
          parent=$(dirname "$target")
          archive="/tmp/answerbit-${sha}.tar.gz"
          release="${parent}/.answerbit-release-${sha}"
          backup="${parent}/.answerbit-backup-${sha}"
          state="/tmp/answerbit-${sha}.had-target"

          rm -rf "$release" "$backup"
          mkdir -p "$parent" "$release"
          tar -xzf "$archive" -C "$release"
          test -f "$release/index.html"
          chmod -R a+rX "$release"

          printf '0\n' > "$state"
          if [ -e "$target" ]; then
            mv "$target" "$backup"
            printf '1\n' > "$state"
          fi

          if ! mv "$release" "$target"; then
            if [ -e "$backup" ]; then
              mv "$backup" "$target"
            fi
            exit 1
          fi

          rm -f "$archive"
          REMOTE

      - name: Verify deployment
        env:
          HEALTHCHECK_URL: ${{ vars.SITE_URL || env.SITE_URL }}
          HEALTHCHECK_HOST: ${{ vars.SITE_HOST || env.SITE_HOST }}
        run: |
          set -Eeuo pipefail
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error \
              --header "Host: ${HEALTHCHECK_HOST}" \
              --max-time 10 --output /tmp/answerbit-health.html "$HEALTHCHECK_URL/" \
              && grep --quiet "AnswerBit" /tmp/answerbit-health.html; then
              exit 0
            fi
            echo "Health check ${attempt}/5 failed; retrying..."
            sleep 3
          done
          exit 1

      - name: Roll back failed deployment
        if: failure() && steps.activate.outcome == 'success'
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i "$HOME/.ssh/deploy_key" -p "$DEPLOY_PORT" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            bash -s -- "$DEPLOY_PATH" "$GITHUB_SHA" <<'REMOTE'
          set -Eeuo pipefail
          target=$1
          sha=$2
          parent=$(dirname "$target")
          backup="${parent}/.answerbit-backup-${sha}"
          state="/tmp/answerbit-${sha}.had-target"

          if [ -f "$state" ] && [ "$(cat "$state")" = "1" ] && [ -e "$backup" ]; then
            rm -rf "$target"
            mv "$backup" "$target"
          fi
          rm -rf "${parent}/.answerbit-release-${sha}"
          rm -f "/tmp/answerbit-${sha}.tar.gz" "$state"
          REMOTE

      - name: Clean up previous release
        if: success()
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i "$HOME/.ssh/deploy_key" -p "$DEPLOY_PORT" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            bash -s -- "$DEPLOY_PATH" "$GITHUB_SHA" <<'REMOTE'
          set -Eeuo pipefail
          target=$1
          sha=$2
          parent=$(dirname "$target")
          rm -rf "${parent}/.answerbit-backup-${sha}" "${parent}/.answerbit-release-${sha}"
          rm -f "/tmp/answerbit-${sha}.tar.gz" "/tmp/answerbit-${sha}.had-target"
          REMOTE
